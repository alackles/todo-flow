[project]
name = "todo-flow"
version = "0.1.0"
description = "Plumbing for Acacia's todo triage workflow"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["inbox"]
testpaths = ["tests"]
